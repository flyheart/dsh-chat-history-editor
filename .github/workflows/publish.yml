name: publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # GitHub OIDC token, exchanged by npm for a publish credential

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the npm CLI trusted publishing requires
        # Trusted publishing needs npm >= 11.10.0; Node 22 bundles npm 10.x.
        # The registry is set explicitly so no .npmrc auth placeholder is needed.
        run: |
          npm install -g npm@^11.15.0
          npm config set registry https://registry.npmjs.org/
          npm --version
      - name: Test
        # Host probes skip when no DSH installation is present; client/tools probes run.
        run: npm test
      - name: Publish through OIDC trusted publishing
        # No NODE_AUTH_TOKEN: npm exchanges the workflow's OIDC token with the
        # registry, and trusted publishing generates provenance automatically.
        run: npm publish
